name: StoryWeaver checks
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libasound2t64 libgtk-3-0 poppler-utils
      - run: xvfb-run -a npm run test:e2e
      - run: npm run pack
